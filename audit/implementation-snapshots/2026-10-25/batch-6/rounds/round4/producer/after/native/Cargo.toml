[package]
name = "poet-cli"
version = "0.0.40"
edition = "2021"

[dependencies]
vibe = { workspace = true }
dioxus = { path = "C:/github/rust-app-framework/packages/dioxus", default-features = false, features = ["macro", "html", "signals", "hooks", "third-party-renderer"], optional = true }
dioxus-native = { path = "C:/github/rust-app-framework/packages/native", default-features = false, features = ["vello-cpu-softbuffer", "system-fonts", "data-uri", "clipboard", "accessibility"], optional = true }
qualia-core-db = { path = "C:/github/qualiaDB/crates/qualia-core-db", default-features = false, features = ["profile_target_1024", "zk-culling", "gpu-runtime", "gpu-native-portable", "gpu-native-dx12", "wgsl-forge", "privacy-he", "sanctuary-crypto"], optional = true }
qualia-geospatial = { path = "C:/github/qualiaDB/crates/qualia-geospatial", optional = true }
webizen-render = { path = "C:/github/qualiaDB/crates/webizen-render", optional = true }
poet-spatial-authoring = { path = "../crates/spatial-authoring", optional = true }
base64 = { version = "=0.22.1", optional = true }
futures-channel = { version = "=0.3.34", optional = true }

qualia-cooperative-core = { path = "C:/github/qualiaDB/crates/qualia-cooperative-core", optional = true }
qualia-mcp = { path = "C:/github/qualiaDB/crates/qualia-mcp", default-features = false, features = ["authoring"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
ciborium = { workspace = true, optional = true }

[features]
native-graphical = ["dep:dioxus", "dep:dioxus-native", "dep:qualia-core-db", "dep:webizen-render", "dep:base64", "dep:futures-channel", "dep:qualia-cooperative-core", "dep:qualia-mcp", "dep:serde", "dep:serde_json", "dep:sha2", "dep:poet-spatial-authoring", "dep:qualia-geospatial", "dep:ciborium"]

[[bin]]
name = "poet"
path = "src/main.rs"

[[example]]
name = "growing_reference"
path = "examples/growing_reference/main.rs"
required-features = ["native-graphical"]

[dev-dependencies]
ciborium.workspace = true
tempfile = "=3.27.0"

# Run the canonical public codec regressions against Poet's exact native dependency closure.
[[test]]
name = "mesh_section_bounds"
path = "../../qualiaDB/crates/qualia-core-db/tests/mesh_section_bounds.rs"
required-features = ["native-graphical"]
